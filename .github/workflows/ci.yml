name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build and test (GCC, OpenSSL)
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install toolchain and OpenSSL
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc libssl-dev openssl curl python3

      - name: Build
        run: make

      - name: Run regression suite
        run: make test

  sanitizers:
    name: ASan / UBSan
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install toolchain and OpenSSL
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc libssl-dev openssl curl python3

      - name: Build and test with sanitizers
        run: make test-asan

  fuzz:
    name: JSON parser fuzz
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc python3

      - name: Fuzz the JSON parser
        run: make test-fuzz
